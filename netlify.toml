[build]
  functions = "netlify/functions"
  command = "pnpm build"

[functions]
  node_bundler = "esbuild"

# Redirect all www to non-www
[[redirects]]
  from = "https://www.fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Redirect all http to https (www)
[[redirects]]
  from = "http://www.fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Redirect all http to https (non-www)
[[redirects]]
  from = "http://fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Short entry point for the Keystatic editor
[[redirects]]
  from = "/edit"
  to = "/keystatic/"
  status = 302
  force = true

[[redirects]]
  from = "/edit/"
  to = "/keystatic/"
  status = 302
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
