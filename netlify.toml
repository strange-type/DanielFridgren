[build]
  functions = "netlify/functions"
  command = "pnpm build"
  # Skip rebuilding the main site when a commit only touches Punkt's
  # task data (punkt/data) — those writes happen on every checkbox
  # toggle and shouldn't redeploy fridgren.se.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!punkt/data'"

[functions]
  node_bundler = "esbuild"

# Keep Punkt out of search engines and other sites' frames, in addition
# to the page's own <meta name="robots"> tag and astro-robots.txt entry.
[[headers]]
  for = "/punkt/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# Always revalidate the app shell itself, so a redeploy is visible on
# the next load instead of getting stuck behind a cached HTML response
# (iOS home-screen apps in particular can otherwise keep showing an old
# build for a long time).
[[headers]]
  for = "/punkt/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/.netlify/functions/punkt-tasks"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Redirect all www to non-www
[[redirects]]
  from = "https://www.fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Redirect all http to https (www)
[[redirects]]
  from = "http://www.fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Redirect all http to https (non-www)
[[redirects]]
  from = "http://fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true
