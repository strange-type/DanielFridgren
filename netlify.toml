[build]
  functions = "netlify/functions"
  command = "pnpm build"
  # Skip rebuilding the main site when a commit only touches Punkt's
  # task data (Notes/punkt/data) — those writes happen on every
  # checkbox toggle and shouldn't redeploy fridgren.se.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!Notes/punkt/data'"

[functions]
  node_bundler = "esbuild"

# Redirect all www to non-www
[[redirects]]
  from = "https://www.fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Redirect all http to https (www)
[[redirects]]
  from = "http://www.fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Redirect all http to https (non-www)
[[redirects]]
  from = "http://fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true
