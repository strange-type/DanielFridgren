[build]
  functions = "netlify/functions"
  command = "pnpm build"

[functions]
  node_bundler = "esbuild"

# Redirect all www to non-www
[[redirects]]
  from = "https://www.fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Redirect all http to https (www)
[[redirects]]
  from = "http://www.fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Redirect all http to https (non-www)
[[redirects]]
  from = "http://fridgren.se/*"
  to = "https://fridgren.se/:splat"
  status = 301
  force = true

# Short entry point for the Keystatic editor
[[redirects]]
  from = "/edit"
  to = "/keystatic/"
  status = 302
  force = true

[[redirects]]
  from = "/edit/"
  to = "/keystatic/"
  status = 302
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Content Security Policy for the Keystatic editor only. The public site loads
# third-party scripts (analytics, Turnstile); the editor must not, because it
# holds the GitHub token in a cookie readable by scripts.
[[headers]]
  for = "/keystatic"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self' https://github.com; frame-ancestors 'none'"

[[headers]]
  for = "/keystatic/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self' https://github.com; frame-ancestors 'none'"

[[headers]]
  for = "/api/keystatic/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; frame-ancestors 'none'"
